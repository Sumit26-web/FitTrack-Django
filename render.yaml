services:
  - type: web
    name: fittrack-django
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn fittrack.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: fittrack-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
databases:
  - name: fittrack-db
    plan: free
